name: Editorial preview checks
on:
  pull_request:
    paths:
      - 'app/meta/**'
      - 'app/editorial/**'
      - 'content/editorial/**'
      - 'lib/editorial-*'
      - 'components/RankedReport.tsx'
      - 'scripts/editorial/**'
      - '.github/workflows/editorial-*.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EDITORIAL_LOCAL_PREVIEW: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-preview-only
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3107
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/editorial
      - run: npm ci
      - run: npx tsc --noEmit
      - run: env -u NEXT_PUBLIC_SUPABASE_ANON_KEY -u NEXT_PUBLIC_SUPABASE_URL npm test -- --runInBand
      - run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: offline-build-only
      - name: Inspect mobile and desktop reports in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/editorial-browser" playwright@1.56.1
          google-chrome --version
          npm start -- -p 3107 > "$RUNNER_TEMP/editorial-web.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3107/meta -o /dev/null
          CHROME_CHANNEL=chrome NODE_PATH="$RUNNER_TEMP/editorial-browser/node_modules" node scripts/editorial/review.cjs
      - name: Render review contact sheet
        if: always()
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          folder = Path('.local/editorial-screenshots')
          tiles = [('weekly-1440-light', (0,0,560,395)), ('weekly-deck-375-dark',(560,0,840,395)), ('monthly-390-light',(0,395,280,790)), ('balance-375-dark',(280,395,560,790)), ('weekly-deck-390-light',(560,395,840,790))]
          if all((folder/(name+'.png')).exists() for name,_ in tiles):
              sheet = Image.new('RGB',(840,790),'#202030')
              for name,(x,y,r,b) in tiles:
                  img = Image.open(folder/(name+'.png')).convert('RGB')
                  img.thumbnail((r-x,b-y-18))
                  sheet.paste(img,(x,y+18))
                  ImageDraw.Draw(sheet).text((x+3,y+2),name,fill='white')
              out = folder/'review.jpg'
              sheet.save(out,quality=72)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-browser-screenshots
          path: .local/editorial-screenshots/
          include-hidden-files: true
          retention-days: 14
